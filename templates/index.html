<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador Inteligente de Plátanos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-leaf"></i>
            <h1>Clasificador de Plátanos</h1>
        </div>
        <span class="status-pill"><i class="fa-solid fa-circle"></i> Servidor Activo</span>
    </header>

    <main class="container">

        <!-- Panel 1: Captura e Imagen -->
        <section class="card camera-card">
            <div class="video-wrapper">
                <video id="video" autoplay playsinline webkit-playsinline muted></video>
                <img id="processed-output" class="hidden" alt="Imagen analizada">
                <canvas id="canvas" class="hidden"></canvas>
            </div>

            <!-- Controles de la Webcam local -->
            <div class="controls">
                <button id="btn-toggle-cam" class="btn btn-primary"><i class="fa-solid fa-video"></i> Iniciar Webcam</button>
                <button id="btn-switch-cam" class="btn btn-secondary"><i class="fa-solid fa-arrows-rotate"></i> Cambiar</button>
                <button id="btn-snap" class="btn btn-action"><i class="fa-solid fa-bolt"></i> Clasificar Webcam</button>
            </div>

            <!-- Controles de captura para ESP32-CAM -->
            <div class="esp32-controls">
                <input type="text" id="esp32-ip" class="input-ip" placeholder="IP ESP32 (ej: 192.168.1.50)">
                <button id="btn-snap-esp32" class="btn btn-secondary"><i class="fa-solid fa-camera"></i> Clasificar ESP32</button>
            </div>

            <!-- Subir archivo local -->
            <div class="upload-fallback">
                <label for="file-input" class="btn-link"><i class="fa-solid fa-upload"></i> O subir foto desde la galería...</label>
                <input type="file" id="file-input" accept="image/*" class="hidden">
            </div>
        </section>

        <!-- Panel 2: Diagnóstico y Porcentajes -->
        <section class="card stats-card">
            <h2>Diagnóstico de Calidad</h2>
            
            <div id="badge-status" class="result-badge badge-neutral">
                Esperando captura...
            </div>

            <!-- Barras de Probabilidad -->
            <div class="probability-container">
                <div class="prob-group">
                    <div class="prob-header">
                        <span><i class="fa-solid fa-circle-check text-success"></i> Estado Sano</span>
                        <span id="percent-sano" class="prob-value">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="bar-sano" class="progress-fill fill-success" style="width: 0%;"></div>
                    </div>
                </div>

                <div class="prob-group">
                    <div class="prob-header">
                        <span><i class="fa-solid fa-triangle-exclamation text-danger"></i> En Mal Estado</span>
                        <span id="percent-bad" class="prob-value">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="bar-bad" class="progress-fill fill-danger" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <!-- Simulador de Separador Mecánico -->
            <div class="sorter-simulation">
                <h3><i class="fa-solid fa-robot"></i> Estado del Separador Físico</h3>
                <div id="sorter-arm" class="arm-status arm-center">
                    Posición: NEUTRAL (Paso Libre)
                </div>
            </div>
        </section>
        
        <section>
            <!-- Recolector de muestras para el Dataset -->
            <div class="dataset-collector" style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #ddd;">
                <h4><i class="fa-solid fa-folder-plus"></i> Guardar para Entrenamiento</h4>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button id="btn-save-sano" class="btn btn-secondary" style="background-color: #28a745; color: white;">
                        💾 Guardar como SANO
                    </button>
                    <button id="btn-save-bad" class="btn btn-secondary" style="background-color: #dc3545; color: white;">
                        💾 Guardar como MAL ESTADO
                    </button>
                </div>
                <span id="save-status-msg" style="font-size: 0.85rem; color: #666; margin-top: 5px; display: block;"></span>
            </div>
        </section>

    </main>

    <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
</body>
</html>
